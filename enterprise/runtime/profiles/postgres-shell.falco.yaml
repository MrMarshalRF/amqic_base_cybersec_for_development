- rule: Shell started by PostgreSQL in a container
  desc: A successful shell exec with a PostgreSQL parent needs investigation.
  condition: >
    evt.type in (execve, execveat) and evt.dir = < and evt.rawres >= 0 and
    container.id != host and proc.pname = postgres and
    proc.name in (sh, bash, dash, ash, zsh, ksh)
  output: "PostgreSQL child shell (container=%container.id parent=%proc.pname process=%proc.name pid=%proc.pid)"
  priority: WARNING
  source: syscall
  tags: [container, postgres, runtime]
