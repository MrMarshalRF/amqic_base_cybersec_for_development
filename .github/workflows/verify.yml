name: Verify public kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run fixed baseline and record skipped integrations
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kit-ci"
          node scripts/verify.mjs ${{ runner.os == 'Linux' && matrix.node == '22' && '--compose' || '' }} --output "$RUNNER_TEMP/kit-ci/baseline.json"
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/kit-ci/*.json
            ${{ runner.temp }}/kit-ci/*.log
          if-no-files-found: warn
          retention-days: 7
  all-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Exercise all fixed local scenarios
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kit-ci"
          sh lab/run.sh --output "$RUNNER_TEMP/kit-ci/all-local.json"
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: all-local-diagnostics
          path: |
            ${{ runner.temp }}/kit-ci/*.json
            ${{ runner.temp }}/kit-ci/*.log
          if-no-files-found: warn
          retention-days: 7
