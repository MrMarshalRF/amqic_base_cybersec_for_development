name: Verify public kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run fixed baseline and record skipped integrations
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kit-ci"
          node scripts/verify.mjs ${{ runner.os == 'Linux' && matrix.node == '22' && '--compose' || '' }} --output "$RUNNER_TEMP/kit-ci/baseline.json"
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/kit-ci/*.json
            ${{ runner.temp }}/kit-ci/*.log
          if-no-files-found: warn
          retention-days: 7
  all-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exercise all fixed local scenarios
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/kit-ci"
          sh lab/run.sh --output "$RUNNER_TEMP/kit-ci/all-local.json"
      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-local-diagnostics
          path: |
            ${{ runner.temp }}/kit-ci/*.json
            ${{ runner.temp }}/kit-ci/*.log
          if-no-files-found: warn
          retention-days: 7
