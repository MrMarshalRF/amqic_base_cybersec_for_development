pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_authorization $auth_user { default anonymous; "Bearer synthetic-A" A; "Bearer synthetic-B" B; }
  map $cookie_lab_user $lab_user { default $auth_user; A A; B B; }
  server {
    listen 8080;
    default_type application/json;
    add_header X-Upstream-Request $request_id always;
    location = /assets/public.0123456789abcdef.js {
      add_header X-Upstream-Request $request_id always;
      add_header Cache-Control "public, max-age=3600, immutable" always;
      return 200 '{"asset":"synthetic-public-v1","user":"$lab_user"}';
    }
    location = /assets/no-store.0123456789abcdef.js {
      add_header X-Upstream-Request $request_id always;
      add_header Cache-Control "private, no-store" always;
      return 200 '{"user":"$lab_user","kind":"no-store"}';
    }
    location = /assets/cookie.0123456789abcdef.js {
      add_header X-Upstream-Request $request_id always;
      add_header Cache-Control "public, max-age=3600" always;
      add_header Set-Cookie "lab_user=$lab_user; Path=/; HttpOnly; SameSite=Strict" always;
      return 200 '{"user":"$lab_user","kind":"set-cookie"}';
    }
    location / {
      add_header X-Upstream-Request $request_id always;
      add_header Cache-Control "private, no-store" always;
      add_header Set-Cookie "lab_user=$lab_user; Path=/; HttpOnly; SameSite=Strict" always;
      return 200 '{"user":"$lab_user","kind":"personal"}';
    }
  }
}
