pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  proxy_temp_path /tmp/proxy;
  proxy_cache_path /tmp/cache levels=1:2 keys_zone=lab_cache:1m max_size=8m inactive=1m;
  map $uri $personal_route { default 1; ~^/assets/(public|no-store|cookie)\.0123456789abcdef\.js$ 0; }
  map $http_authorization $has_auth { default 1; "" 0; }
  map $http_cookie $has_cookie { default 1; "" 0; }
  server {
    listen 8080;
    server_tokens off;
    location / {
      proxy_pass http://synthetic-upstream:8080;
      proxy_cache lab_cache;
      proxy_cache_key "$scheme|$host|$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_bypass $personal_route $has_auth $has_cookie;
      proxy_no_cache $personal_route $has_auth $has_cookie $upstream_http_set_cookie;
      proxy_set_header Host synthetic-upstream;
      proxy_set_header X-Lab-Cache-Status "";
      proxy_hide_header X-Lab-Cache-Status;
      add_header X-Lab-Cache-Status $upstream_cache_status always;
      # Default Nginx Cache-Control/Set-Cookie/Vary processing remains enabled.
    }
  }
}
